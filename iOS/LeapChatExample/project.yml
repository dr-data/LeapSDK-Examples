name: ai.liquid.LeapChatExample
options:
  bundleIdPrefix: ai.liquid.examples
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  LeapSDK:
    path: ..

targets:
  LeapChatExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LeapChatExample
        name: Sources
        createIntermediateGroups: true
        excludes:
          - "Resources/**"
    resources:
      - path: LeapChatExample/Assets.xcassets
        name: Assets
      - path: LeapChatExample/Resources
        name: Resources
        createIntermediateGroups: true
    dependencies:
      - package: LeapSDK
        product: LeapSDK
      - package: LeapSDK
        product: LeapModelDownloader
      - package: LeapSDK
        product: MLXSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.LeapChatExample
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  LeapChatExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeapChatExampleTests
    dependencies:
      - target: LeapChatExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.examples.LeapChatExampleTests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"

  LeapChatExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeapChatExampleUITests
    dependencies:
      - target: LeapChatExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.examples.LeapChatExampleUITests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"
