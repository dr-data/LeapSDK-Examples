name: ai.liquid.LeapChatExample
options:
  bundleIdPrefix: ai.liquid.examples
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  LeapSDK:
    path: ..
  mlx-swift:
    url: "https://github.com/ml-explore/mlx-swift"
    minorVersion: "0.30.3"
  swift-transformers:
    url: "https://github.com/huggingface/swift-transformers"
    minorVersion: "1.1.6"
  onnxruntime:
    url: "https://github.com/microsoft/onnxruntime-swift-package-manager"
    from: "1.18.0"
  ZIPFoundation:
    url: "https://github.com/weichsel/ZIPFoundation.git"
    from: "0.9.0"
  AEXML:
    url: "https://github.com/tadija/AEXML.git"
    from: "4.6.0"

targets:
  LeapChatExample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LeapChatExample
        name: Sources
        createIntermediateGroups: true
        excludes:
          - "Resources/**"
    resources:
      - path: LeapChatExample/Assets.xcassets
        name: Assets
      - path: LeapChatExample/Resources
        name: Resources
        createIntermediateGroups: true
    dependencies:
      - package: LeapSDK
        product: LeapSDK
      - package: LeapSDK
        product: LeapModelDownloader
      - package: LeapSDK
        product: MLXSupport
      - package: mlx-swift
        product: MLXNN
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: onnxruntime
        product: onnxruntime
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: AEXML
        product: AEXML
    entitlements:
      path: LeapChatExample/LeapChatExample.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: college.3rd.LeapChatExample
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: LeapChatExample/LlamaCppBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: PTYW3X8AU6
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  LeapChatExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeapChatExampleTests
    dependencies:
      - target: LeapChatExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.examples.LeapChatExampleTests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"

  LeapChatExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeapChatExampleUITests
    dependencies:
      - target: LeapChatExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.examples.LeapChatExampleUITests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"
